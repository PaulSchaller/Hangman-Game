<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap-theme.min.css" integrity="sha384-rHyoN1iRsVXV4nD0JutlnGaslCJuC7uwjduW9SVrLvRYooPp2bWYgmgJQIXwl/Sp" crossorigin="anonymous">

    <meta charset="UTF-8">
    <title>Hangman Game</title>

    <link rel="stylesheet" type="text/css" href="assets/css/reset.css">
    <link rel="stylesheet" type="text/css" href="assets/css/style.css">

</head>

<body>

<div class="container text-center">

    <h1>HANGMAN</h1>

    <h2>A Choice of Colors</h2>

    <img src="assets/images/Paints.jpg" alt="Paints" class="img-responsive center-block">

    <br>

    <h3>
        Max is a painter. You can help him choose the next color
        for his project by guessing the word correctly.
    </h3>

    <div>
        <img src="assets/images/Max(1).jpg" alt="Max">
        <img src="assets/images/Max(2).jpg" alt="Max">
        <img src="assets/images/Max(5).jpg" alt="Max">
    </div>

    <br>

    <h4>Press Any Key To Get Started</h4>

    <h5>Choose A Letter</h5>

    <hr>

    <!-- Game Area -->

    <h2 id="answer">_ _ _ _</h2>

    <h3 id="counter">Guesses Left: 10</h3>

    <h4 id="guesses">Guessed Letters:</h4>

    <h2 id="congratulations"></h2>

    <h2 id="lose"></h2>

    <button id="playAgain" onclick="initializeGame()">
    Play Again
    </button>
</div>

<script src="assets/javascript/game(a).js"></script>

<script>
setTimeout(() => {
    document.body.style.setProperty("background-color", "white", "important");
}, 2000);
</script>


</body>
</html>
